<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Merci de votre avis</title>
    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: auto;
            padding-top: 70px;
            text-align: center;
            background: #f5f5f7;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            max-width: 800px;
            margin: auto;
            background: #f5f5f7;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .top-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .btn {
            padding: 8px 14px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .btn:hover {
            background: #1a252f;
        }

        h1 {
            color: #2c3e50;
            margin-top: 40px;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
        }

        .mail-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }

        .mail-btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="btn">⬅ Retour au site</a>
    <div class="top-title">Avis prêt à envoyer</div>
    <a href="avis.html" class="btn">Voir les avis ➤</a>
</div>

<h1>Merci de votre avis</h1>

<p>Cliquez ci-dessous pour l’envoyer par email.</p>

<a id="mailBtn" class="mail-btn">Envoyer l’avis par email</a>

<script>
window.onload = function() {
    // Récupération du texte envoyé depuis donner-avis.html
    const params = new URLSearchParams(window.location.search);
    const texte = params.get("texte");

    // Construction du mail complet
    const mailto = "mailto:avis.ibacours@gmail.com"
                 + "?subject=Nouvel%20avis%20client"
                 + "&body=" + texte;

    // On met le lien dans le bouton
    document.getElementById("mailBtn").href = mailto;
};
</script>

</body>
</html>
