<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>

/* PAGE D'INTRO */
#intro {
    padding-top: 40px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    perspective: 1200px;
}

/* --- ANIMATION FLIP CARD GÉNÉRIQUE --- */
.flip-card {
    width: min(60vw, 350px);   /* responsive */
    height: min(60vw, 350px);  /* responsive */
    position: relative;
    transform-style: preserve-3d;
    animation: flipCard 6s ease-in-out forwards;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
    flex-shrink: 0;
}

/* Faces */
.face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;
}

.back {
    transform: rotateY(180deg);
}

/* Animation Flip Card */
@keyframes flipCard {
    0%   { transform: rotateY(0deg); }
    20%  { transform: rotateY(0deg); }
    40%  { transform: rotateY(180deg); }
    60%  { transform: rotateY(180deg); }
    80%  { transform: rotateY(360deg); }
    100% { transform: rotateY(360deg); }
}

/* --- LOGO SAP --- */
.logo-sap {
    width: min(50vw, 250px);
    max-width: 250px;
    opacity: 0;
    margin-top: 20px;
    animation: sapMove 1s ease-out 6s forwards, flipCard 6s ease-in-out 6s forwards;
}

@keyframes sapMove {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* --- LOGO AVANCE IMMÉDIATE --- */
.logo-ai {
    width: min(50vw, 250px);
    max-width: 250px;
    opacity: 0;
    margin-top: 20px;
    animation: aiMove 1s ease-out 12s forwards, flipCard 6s ease-in-out 12s forwards;
}

@keyframes aiMove {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Texte */
.intro-subtitle {
    font-size: min(5vw, 24px);
    margin-top: 10px;
    opacity: 0;
    animation: sapMove 1s ease-out 6s forwards;
}

</style>
</head>

<body>

<div id="intro">

    <!-- IBA COURS -->
    <div class="flip-card">
        <img src="Logo IBA COURS.png" class="face">
        <img src="Logo IBA COURS.png" class="face back">
    </div>

    <!-- SAP -->
    <img src="service-a-la-personne.png" class="logo-sap">

    <!-- AVANCE IMMÉDIATE -->
    <img src="avance-immediate.png" class="logo-ai">

</div>

</body>
</html>
