<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>
/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;

    /* On met en pause le fondu pour bien voir la rotation */
    /* animation: introFadeOut 2s ease-in-out 3s forwards; */

    /* Perspective globale pour le 3D */
    perspective: 1200px;
}

/* --- CONTENEUR 3D ROTATION HORIZONTALE --- */
.logo-flip-3d {
    width: 500px;
    height: 500px;
    position: relative;
    transform-style: preserve-3d;

    /* Rotation sur l’axe X (horizontal) */
    animation: flipX 4s linear infinite;

    /* Ombre réaliste */
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
}

/* Face avant */
.logo-face,
.logo-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

/* Face avant : logo normal */
.logo-face {
    transform: rotateX(0deg);
}

/* Face arrière : même logo, mais retourné verticalement */
.logo-back {
    transform: rotateX(180deg) scaleY(-1);
}

/* Lumière glissante */
.logo-flip-3d::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;

    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.0) 100%
    );

    animation: lightMove 4s linear infinite;
    pointer-events: none;
}

/* Rotation horizontale complète */
@keyframes flipX {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(360deg); }
}

/* Lumière qui glisse */
@keyframes lightMove {
    0%   { transform: translateY(-100%); }
    50%  { transform: translateY(100%); }
    100% { transform: translateY(-100%); }
}

/* Logo SAP (en dessous) */
.intro-logo {
    width: 60%;
    max-width: 500px;
    height: auto;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInLogo 1s ease-out 1s forwards;
    background-color: transparent;
}

@keyframes fadeInLogo {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Animations du texte */
.intro-title {
    font-size: 48px;
    font-weight: bold;
    animation: slideDown 1s ease-out;
}

.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    animation: slideUp 1s ease-out 0.5s;
}

@keyframes slideDown {
    from { transform: translateY(-40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<body>

<div id="intro">

    <!-- ROTATION RECTO-VERSO HORIZONTALE -->
    <div class="logo-flip-3d">
        <img src="Logo IBA COURS.png" class="logo-face">
        <img src="Logo IBA COURS.png" class="logo-back">
    </div>

    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">

</div>

</body>
</html>
