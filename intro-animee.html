<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>

/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    perspective: 1200px;
}

/* --- CONTENEUR 3D AVEC ANIMATION FLIP CARD --- */
.logo-sequence {
    width: 500px;
    height: 500px;
    position: relative;
    transform-style: preserve-3d;
    animation: flipCard 6s ease-in-out forwards;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
    flex-shrink: 0;
}

/* Face avant */
.logo-face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;
}

/* Face arrière */
.logo-back {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;

    /* verso inversé */
    transform: rotateY(180deg);
}

/* Animation Flip Card Premium */
@keyframes flipCard {
    0%   { transform: rotateY(0deg); }
    20%  { transform: rotateY(0deg); }

    /* rotation vers le verso */
    40%  { transform: rotateY(180deg); }

    /* verso visible */
    60%  { transform: rotateY(180deg); }

    /* retour vers le recto */
    80%  { transform: rotateY(360deg); }

    /* stabilisation */
    100% { transform: rotateY(360deg); }
}

/* --- LOGO SAP --- */
.intro-logo {
    width: 40%;
    max-width: 300px;
    height: auto;
    opacity: 0;
    margin-top: 20px;

    /* apparition après l’animation flip */
    animation: sapAppear 1.5s ease-out 6s forwards;
}

@keyframes sapAppear {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Texte */
.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    opacity: 0;
    animation: sapAppear 1.5s ease-out 6s forwards;
}

</style>
</head>

<body>

<div id="intro">

    <!-- FLIP CARD RECTO-VERSO -->
    <div class="logo-sequence">
        <img src="Logo IBA COURS.png" class="logo-face">
        <img src="Logo IBA COURS.png" class="logo-back">
    </div>

    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">

</div>

</body>
</html>
