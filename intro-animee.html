<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>

/* PAGE D'INTRO */
#intro {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 10px;
    z-index: 9999;
    perspective: 1200px;
    overflow: hidden;
}

/* --- ANIMATION FLIP CARD --- */
.flip-card {
    width: min(85vw, 420px);
    height: min(85vw, 420px);
    position: relative;
    transform-style: preserve-3d;
    animation: flipCard 6s ease-in-out forwards;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
    margin-bottom: 10px;
}

.face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;
}

.back {
    transform: rotateY(180deg);
}

@keyframes flipCard {
    0%   { transform: rotateY(0deg); }
    40%  { transform: rotateY(180deg); }
    80%  { transform: rotateY(360deg); }
    100% { transform: rotateY(360deg); }
}

/* --- CONTENEUR DES LOGOS SAP + AI --- */
.logo-row {
    display: flex;
    flex-direction: row; /* 💻 PAR DÉFAUT : côte à côte */
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
}

/* 💻 PC : tailles */
.logo-sap {
    width: 220px; /* SAP petit */
    opacity: 0;
}

.logo-ai {
    width: 500px; /* 🔥 AI plus grand sur PC 🔥 */
    opacity: 0;
}

/* 📱 MOBILE : logos en colonne */
@media (max-width: 900px) {
    .logo-row {
        flex-direction: column; /* en dessous */
        gap: 10px;
    }

    .logo-sap,
    .logo-ai {
        width: min(75vw, 360px);
    }
}

/* Animations */
.logo-sap {
    animation: sapMove 1s ease-out 6s forwards,
               flipCard 6s ease-in-out 6s forwards;
}

.logo-ai {
    animation: aiMove 1s ease-out 12s forwards,
               flipCard 6s ease-in-out 12s forwards;
}

@keyframes sapMove {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes aiMove {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div id="intro">

    <!-- IBA COURS -->
    <div class="flip-card">
        <img src="Logo IBA COURS.png" class="face">
        <img src="Logo IBA COURS.png" class="face back">
    </div>

    <!-- SAP + AVANCE IMMÉDIATE -->
    <div class="logo-row">
        <img src="service-a-la-personne.png" class="logo-sap">
        <img src="avance-immediate.png" class="logo-ai">
    </div>

</div>

</body>
</html>
