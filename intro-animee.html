<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>

/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    perspective: 1200px;
}

/* --- CONTENEUR 3D AVEC ANIMATION SÉQUENCÉE --- */
.logo-sequence {
    width: 500px;       /* même taille que sur la page de garde */
    height: 500px;
    position: relative;
    transform-style: preserve-3d;
    animation: sequenceAnim 14s linear forwards;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
    flex-shrink: 0;
}

/* Faces recto-verso */
.logo-face {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.logo-back {
    width: 100%;
    height: 100%;
    object-fit: contain;

    /* INDISPENSABLE : sinon tu vois deux logos */
    transform: rotateX(180deg) scaleY(-1);
}

/* Animation séquencée */
@keyframes sequenceAnim {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    15%  { transform: rotateX(0deg) rotateY(0deg); }
    40%  { transform: rotateX(1080deg) rotateY(0deg); }
    70%  { transform: rotateX(1080deg) rotateY(1080deg); }
    100% { transform: rotateX(0deg) rotateY(0deg); }
}

/* --- LOGO SAP : apparition APRÈS l’animation --- */
.intro-logo {
    width: 40%;
    max-width: 300px;
    height: auto;
    opacity: 0;
    margin-top: 20px;
    animation: sapAppear 1.5s ease-out 14s forwards;
}

@keyframes sapAppear {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Texte */
.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    opacity: 0;
    animation: sapAppear 1.5s ease-out 14s forwards;
}

</style>
</head>

<body>

<div id="intro">

    <!-- ROTATION SÉQUENCÉE RECTO-VERSO -->
    <div class="logo-sequence">
        <img src="Logo IBA COURS.png" class="logo-face">
        <img src="Logo IBA COURS.png" class="logo-back">
    </div>

    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">

</div>

</body>
</html>
