<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>
/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;

    /* Perspective globale */
    perspective: 1200px;

    /* Fondu désactivé pour observer l’animation */
    /* animation: introFadeOut 2s ease-in-out 3s forwards; */
}

/* --- CONTENEUR 3D AVEC ANIMATION SÉQUENCÉE --- */
.logo-sequence {
    width: 500px;
    height: 500px;
    position: relative;
    transform-style: preserve-3d;

    /* Animation séquencée */
    animation: sequenceAnim 14s ease-in-out forwards;

    /* Ombre réaliste */
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
}

/* Faces recto-verso */
.logo-face, .logo-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
}

/* Face avant */
.logo-face {
    transform: rotateX(0deg);
}

/* Face arrière : retournée pour rester lisible */
.logo-back {
    transform: rotateX(180deg) scaleY(-1);
}

/* Lumière glissante */
.logo-sequence::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.0) 100%
    );
    animation: lightMove 4s linear infinite;
    pointer-events: none;
}

/* Animation séquencée */
@keyframes sequenceAnim {

    /* 0–2s : logo normal */
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    15%  { transform: rotateX(0deg) rotateY(0deg); }

    /* 2–6s : 3 rotations horizontales */
    15%  { transform: rotateX(0deg); }
    40%  { transform: rotateX(1080deg); } /* 3 × 360° */

    /* 6–10s : 3 rotations verticales */
    40%  { transform: rotateY(0deg); }
    70%  { transform: rotateY(1080deg); } /* 3 × 360° */

    /* 10–14s : retour normal et stop */
    70%  { transform: rotateX(0deg) rotateY(0deg); }
    100% { transform: rotateX(0deg) rotateY(0deg); }
}

/* Lumière */
@keyframes lightMove {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

/* Logo SAP (en dessous) */
.intro-logo {
    width: 60%;
    max-width: 500px;
    height: auto;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInLogo 1s ease-out 1s forwards;
    background-color: transparent;
}

@keyframes fadeInLogo {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Animations du texte */
.intro-title {
    font-size: 48px;
    font-weight: bold;
    animation: slideDown 1s ease-out;
}

.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    animation: slideUp 1s ease-out 0.5s;
}

@keyframes slideDown {
    from { transform: translateY(-40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<body>

<div id="intro">

    <!-- ROTATION SÉQUENCÉE RECTO-VERSO -->
    <div class="logo-sequence">
        <img src="Logo IBA COURS.png" class="logo-face">
        <img src="Logo IBA COURS.png" class="logo-back">
    </div>

    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">

</div>

</body>
</html>
