<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>
/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;

    /* 🔸 Fondu désactivé pour observer la rotation */
    /* animation: introFadeOut 2s ease-in-out 3s forwards; */
}

/* --- EFFET 3D + LUMIÈRE SIMULÉE --- */
.rotate-horizontal-3d {
    width: 500px;

    /* Rotation */
    animation: slideDown 1s ease-out, spinX 4s linear infinite;

    /* 3D */
    transform-style: preserve-3d;
    perspective: 900px;

    /* Ombre douce */
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));

    /* Lumière simulée */
    position: relative;
}

.rotate-horizontal-3d::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;

    /* Dégradé lumineux */
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.0) 100%
    );

    /* Animation de la lumière */
    animation: lightMove 4s linear infinite;

    /* Pour que la lumière soit au-dessus */
    pointer-events: none;
}

@keyframes spinX {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(360deg); }
}

@keyframes lightMove {
    0%   { transform: translateX(-100%) rotate(0deg); }
    50%  { transform: translateX(100%) rotate(0deg); }
    100% { transform: translateX(-100%) rotate(0deg); }
}

/* Logo SAP */
.intro-logo {
    width: 60%;
    max-width: 500px;
    height: auto;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInLogo 1s ease-out 1s forwards;
    background-color: transparent;
}

@keyframes fadeInLogo {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Animations du texte */
.intro-title {
    font-size: 48px;
    font-weight: bold;
    animation: slideDown 1s ease-out;
}

.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    animation: slideUp 1s ease-out 0.5s;
}

@keyframes slideDown {
    from { transform: translateY(-40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1); }
}
</style>
</head>

<body>

<div id="intro">
    <img src="Logo IBA COURS.png" class="rotate-horizontal-3d">
    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">
</div>

</body>
</html>
