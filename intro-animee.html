<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Intro animée</title>

<style>
.intro-logo {
    flex-shrink: 0;   /* empêche le SAP de réduire l’espace du logo IBA */
}
   
/* PAGE D'INTRO */
#intro {
    padding-top: 70px;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #f7f3e9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    perspective: 1200px;
}

/* --- CONTENEUR 3D AVEC ANIMATION SÉQUENCÉE --- */
.logo-sequence {
    width: 500px;       /* même taille que sur la page de garde */
    height: 500px;      /* hauteur fixe pour éviter les déformations */
    position: relative;
    transform-style: preserve-3d;
    animation: sequenceAnim 14s linear forwards;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.35));
    flex-shrink: 0;     /* empêche le conteneur de se réduire */
}

/* Faces recto-verso */
.logo-face,
.logo-back {
    width: 100%;
    height: 100%;
    object-fit: contain;   /* garde les proportions exactes */
}


/* Lumière glissante */
.logo-sequence::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.0) 0%,
        rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.0) 100%
    );
    animation: lightMove 4s linear infinite;
    pointer-events: none;
}

/* Animation séquencée */
@keyframes sequenceAnim {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    15%  { transform: rotateX(0deg) rotateY(0deg); }
    40%  { transform: rotateX(1080deg) rotateY(0deg); }
    70%  { transform: rotateX(1080deg) rotateY(1080deg); }
    100% { transform: rotateX(0deg) rotateY(0deg); }
}

/* Lumière */
@keyframes lightMove {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}

/* --- LOGO SAP : apparition APRÈS l’animation --- */
.intro-logo {
    width: 40%;
    max-width: 300px;
    height: auto;
    opacity: 0;
    margin-top: 20px;
    /* Apparition retardée de 14 secondes */
    animation: sapAppear 1.5s ease-out 14s forwards;
}

@keyframes sapAppear {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Texte */
.intro-subtitle {
    font-size: 24px;
    margin-top: 10px;
    opacity: 0;

    /* Apparition synchronisée avec le logo SAP */
    animation: sapAppear 1.5s ease-out 14s forwards;
}
</style>
</head>

<body>

<div id="intro">

    <!-- ROTATION SÉQUENCÉE RECTO-VERSO -->
    <div class="logo-sequence">
        <img src="Logo IBA COURS.png" class="logo-face">
        <img src="Logo IBA COURS.png" class="logo-face">
    </div>

    <p class="intro-subtitle">Organisme déclaré</p>
    <img src="service-a-la-personne.png" class="intro-logo">

</div>

</body>
</html>
