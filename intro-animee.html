<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IBA Cours</title>

<style>
 
body{
margin:0;
background:#f7f3e9;
overflow:hidden;
font-family:Arial,sans-serif;
}
 
#intro{
width:100vw;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}
 
/* Texte du haut */
.intro-text{
margin-top:20px;
font-size:60px;
font-weight:bold;
color:#333;
}
 
/* Logo IBA */
.logo-iba{
width:400px;
opacity:0;
animation:fadeIn 2s forwards;
}
 
@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}
 
/* Zone cercle */
.orbit-container{
position:relative;
width:600px;
height:600px;
margin-top:20px;
}
 
/* Centre */
.bayonne{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
font-weight:bold;
color:#002B5C;
text-align:center;
}
 
/* Cercle qui tourne */
.orbit{
position:absolute;
width:100%;
height:100%;
animation:rotate 20s linear infinite;
}
 
@keyframes rotate{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}
 
/* Logos */
.logo{
position:absolute;
width:160px;
}
 
/* Positions */
.sap{
top:0;
left:50%;
transform:translateX(-50%);
}
 
.ai{
bottom:40px;
left:0;
}
 
.formateur{
bottom:40px;
right:0;
}
 
</style>
</head>
 
<body>
 
<div id="intro">
 
<div class="intro-text">
Je suis
</div>

Logo IBA COURS.png
 
<div class="orbit-container">
 
<div class="bayonne">
⚓<br>
BAYONNE
</div>
 
<div class="orbit">
 
<img src="service-a-la-personne.png"
class="logo sap">
 
<img src="l-avance-immediate.png"
class="logo ai">
 
<img src="l-avance-immediate.png">
 
</div>

</div>
 
</div>
 
</body>
</html>
