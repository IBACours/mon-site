<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déposer un avis</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; }
        label { font-weight: bold; }
        textarea, input { width: 100%; }
        button { padding: 10px 20px; margin-top: 20px; }

        /* ⭐ Style des étoiles SVG */
        .stars {
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;
            cursor: pointer;
        }

        .stars input {
            display: none;
        }

        .stars label svg {
            width: 40px;
            height: 40px;
            fill: #ddd; /* ⭐ étoiles blanches/grises */
            transition: fill 0.2s, transform 0.2s;
        }

        /* Survol */
        .stars label:hover svg,
        .stars label:hover ~ label svg {
            fill: gold;
            transform: scale(1.2);
        }

        /* Clic */
        .stars input:checked ~ label svg {
            fill: gold;
        }
    </style>
</head>
<body>

<h1>Déposer un avis</h1>

<p>Merci de prendre un moment pour partager votre avis.</p>

<form onsubmit="envoyerAvis(event)">
    
    <label for="fullname">Votre nom et prénom :</label><br>
    <input type="text" id="fullname" required><br><br>

    <!-- ⭐ Bloc étoiles SVG -->
    <label>Votre note :</label><br>

    <div class="stars">
        <input type="radio" id="star5" name="note" value="5" required>
        <label for="star5">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
        </label>

        <input type="radio" id="star4" name="note" value="4">
        <label for="star4">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
        </label>

        <input type="radio" id="star3" name="note" value="3">
        <label for="star3">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
        </label>

        <input type="radio" id="star2" name="note" value="2">
        <label for="star2">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
        </label>

        <input type="radio" id="star1" name="note" value="1">
        <label for="star1">
            <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
        </label>
    </div>

    <br><br>

    <label for="avis">Votre avis :</label><br>
    <textarea id="avis" required></textarea><br><br>

    <button type="submit">Envoyer</button>
</form>

<script>
function envoyerAvis(e) {
    e.preventDefault();

    const nom = document.getElementById('fullname').value;
    const avis = document.getElementById('avis').value;
    const note = document.querySelector('input[name="note"]:checked').value;

    const sujet = encodeURIComponent("Nouvel avis client");

    const corps = encodeURIComponent(
        "Nom et prénom : " + nom +
        "\nNote : " + note + " étoiles" +
        "\n\nAvis :\n" + avis
    );

    window.location.href = "mailto:avis.ibacours@gmail.com?subject=" + sujet + "&body=" + corps;

    setTimeout(() => {
        window.location.href = "confirmation.html";
    }, 1500);
}
</script>

<p>Votre avis sera examiné avant publication.</p>

</body>
</html>
