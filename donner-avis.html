<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déposer un avis</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; }
        label { font-weight: bold; }
        textarea, input { width: 100%; }
        button { padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>

<h1>Déposer un avis</h1>

<p>Merci de prendre un moment pour partager votre avis.</p>

<form onsubmit="envoyerAvis(event)">
    <label>Votre nom :</label><br>
    <input type="text" id="nom" required><br><br>

    <label>Votre avis :</label><br>
    <textarea id="avis" required></textarea><br><br>

    <button type="submit">Envoyer</button>
</form>

<script>
function envoyerAvis(e) {
    e.preventDefault();

    const nom = document.getElementById('nom').value;
    const avis = document.getElementById('avis').value;

    const sujet = encodeURIComponent("Nouvel avis client");
    const corps = encodeURIComponent("Nom : " + nom + "\n\nAvis :\n" + avis);

    // Ouvre l'application email du client
    window.location.href = "mailto:TON_EMAIL?subject=" + sujet + "&body=" + corps;

    // Redirection automatique vers la page de confirmation
    setTimeout(() => {
        window.location.href = "confirmation.html";
    }, 500);
}
</script>

<p>Votre avis sera examiné avant publication.</p>

</body>
</html>
