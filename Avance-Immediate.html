<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AVANCE IMMÉDIATE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding-top: 80px; /* espace sous la barre fixe */
            background: #f5f5f7;
        }

        /* ⭐ BARRE FIXE IDENTIQUE AUX AUTRES PAGES */
        .top-bar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            background: #f5f5f7;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .top-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .btn {
            padding: 10px 18px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1em;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #1a252f;
            transform: scale(1.05);
        }

        /* ⭐ CONTENU */
        .content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
    </style>
</head>

<body>

    <!-- ⭐ BARRE FIXE IDENTIQUE AUX AUTRES PAGES -->
    <div class="top-bar">
        <a href="index.html" class="btn">Retour au Site</a>
        <div class="top-title">Avance Immédiate</div>
        <a href="index.html" class="btn">Retour au Site</a>
    </div>

    <!-- ⭐ CONTENU PRINCIPAL -->
    <div class="content">
        <h2>Qu’est‑ce que l’Avance Immédiate ?</h2>
        <p>
            Ici tu mets ton texte, tes explications, tes images, etc.
        </p>
    </div>

</body>
</html>
