<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AVANCE IMMEDIATE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding-top: 50px; /* espace sous la barre fixe */
            background: #f5f5f7;
        }

        /* ⭐ BARRE FIXE AVEC TITRE + BOUTONS */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: #f5f5f7;
            padding: 10px 20px; /* hauteur réduite */
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .top-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px; /* taille réduite */
            font-weight: bold;
            color: #333;
        }

        .btn {
            padding: 8px 14px; /* boutons plus petits */
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95em;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #1a252f;
            transform: scale(1.05);
        }
